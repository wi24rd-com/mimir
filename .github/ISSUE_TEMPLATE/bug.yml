name: Something is broken
description: Mimir does something other than it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Leave out passphrases, tokens and app keys, and anything from your figures you do not want in the open. Describe them instead.
        A security problem does not belong here: use **Report a vulnerability** under the Security tab.
  - type: input
    id: version
    attributes:
      label: Mimir version
      description: The version in the bottom right corner of the dashboard, or in package.json.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Installing or setting up
        - Collecting (the Collect workflow)
        - The dashboard on GitHub Pages
        - The dashboard on my computer
        - The terminal view
        - Updating
        - Badges or published figures
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - encrypted
        - public
        - private
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be seen again?
      description: The steps, as short as they can be.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What the terminal or the failed run said
      description: Paste the lines that matter. Check them for names and secrets first.
      render: text
  - type: input
    id: system
    attributes:
      label: Computer and browser
      placeholder: "macOS 15, Firefox 159, Node 22"
