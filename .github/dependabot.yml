# Mimir has no packages to update. Its two workflows use actions that are
# locked to a commit, and this keeps those locks from going stale: once a
# month, one pull request with the newer commits, for a person to review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Actions"
